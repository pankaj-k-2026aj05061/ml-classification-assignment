name: Train, test, and save churn models

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "train_models.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/train-and-save-models.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-test-save:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify syntax
        run: python -m py_compile app.py train_models.py tests/test_models.py
      - name: Train five classifiers and generate evaluation files
        run: python train_models.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test Streamlit startup
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl --silent --fail http://localhost:8501/_stcore/health >/dev/null; then
              echo "Streamlit health check passed."
              exit 0
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat streamlit.log
              exit 1
            fi
            sleep 1
          done
          cat streamlit.log
          echo "Streamlit did not become healthy."
          exit 1
      - name: Commit generated model artifacts and metric CSVs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Save trained churn models and test metrics"
          file_pattern: "model/*.joblib model/manifest.json test_data.csv evaluation_results.csv evaluation_results_ranked.csv"
