name: Train, test, and save churn models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-test-save:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify syntax
        run: python -m py_compile app.py train_models.py tests/test_models.py
      - name: Train five classifiers and generate evaluation files
        run: python train_models.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
