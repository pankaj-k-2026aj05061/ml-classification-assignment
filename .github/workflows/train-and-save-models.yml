name: Train, test, and save model artifacts

on:
  push:
    branches: [main]
    paths:
      - "train_models.py"
      - "requirements.txt"
      - "tests/**"
      - ".github/workflows/train-and-save-models.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-test-save:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Train all five models and write test data
        run: python train_models.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Commit generated model artifacts and experiment CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/*.joblib model/manifest.json test_data.csv evaluation_results.csv evaluation_results_ranked.csv
          if git diff --cached --quiet; then
            echo "No generated artifact changes."
          else
            git commit -m "Add reproducible trained models and evaluation data"
            git push
          fi
